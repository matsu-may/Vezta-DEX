title = "Vezta DEX secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Reviewed public EVM addresses in deterministic tests and browser fixtures"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^0x[0-9a-fA-F]{40}$''']
  paths = [
    '''^apps/api/src/.*\.test\.ts$''',
    '''^apps/web/lib/.*\.test\.ts$''',
    '''^scripts/.*\.test\.mjs$''',
    '''^apps/web/lib/fixtures/testnet-wallet-browser\.json$''',
    '''^scripts/smoke-(testnet-wallet|rehearsal)-browser\.js$''',
  ]
